# ==============================================================================
# VENDORA ENTERPRISE BACKEND CONFIGURATION
# ==============================================================================
spring.application.name=vendora-backend
server.port=${SERVER_PORT:8080}

# Active Profile (default: local PostgreSQL-compatible, use 'postgres' for standalone PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT Security Configuration
vendora.jwt.secret=${JWT_SECRET:VendoraEnterpriseSuperSecretSigningKey2026ForHmacSha256SecurityValidation!}
vendora.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Secure File Storage Configuration
vendora.storage.upload-dir=${UPLOAD_DIR:./uploads}
vendora.approval.manager-max-threshold=${MANAGER_APPROVAL_THRESHOLD:50000.00}
vendora.approval.finance-max-threshold=${FINANCE_APPROVAL_THRESHOLD:250000.00}
