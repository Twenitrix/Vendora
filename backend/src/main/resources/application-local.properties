# ==============================================================================
# LOCAL DEVELOPMENT PROFILE (PostgreSQL-compatible Mode with Persistent Storage)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vendora_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
